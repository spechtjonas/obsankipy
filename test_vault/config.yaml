vault:
  dir_path: .
  medias_dir_path: ./media
  exclude_dotted_dirs_from_scan: true
notetypes:
  Obsidian:
    regexes:
      - '^#+ (?:(?:Abkürzung *\n+((?:(?:^[^\n#].{0,2}$|^[^\n#].{3}(?<!<!--)(?<!\!Mer).*)\n*)+))|(?:Synonym *\n+((?:(?:^[^\n#].{0,2}$|^[^\n#].{3}(?<!<!--)(?<!\!Mer).*)\n*)+))|(?:Definition *\n+((?:(?:^[^\n#].{0,2}$|^[^\n#].{3}(?<!<!--)(?<!\!Mer).*)\n*)+))|(?:(.+) *\n+(?:(\!\[\[.*\]\])\n*)?((?:(?:^[^\n#].{0,2}$|^[^\n#].{3}(?<!<!--)(?<!\!Mer).*)\n*)+)))(?:!Merke((?:\n(?:^[^\n#].{0,2}$|^[^\n#].{3}(?<!<!--).*))+))?'
    fields:
      - Context: CONTEXT
      - Abkürzung: 1
      - Synonym: 2
      - Definition: 3
      - Sonstige Frage: 4
      - Bild: 5
      - Sonstige Antwort: 6
      - Merkhilfe: 7
      - Link: LINK
globals:
  anki:
    deck_name: TestDeck
    url: http://localhost:8765
